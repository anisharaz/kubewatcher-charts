{{- if and .Values.enrollmentToken (not .Values.enrollmentTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.name" . }}-enrollment
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollmentToken | quote }}
{{- end }}
{{- if .Values.backendCA }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.name" . }}-backend-ca
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
data:
  ca.crt: |
{{ .Values.backendCA | indent 4 }}
{{- end }}
