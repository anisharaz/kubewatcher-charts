{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []          # the agent accepts no inbound connections
  egress:
    - ports:           # DNS
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
    {{- end }}
{{- end }}
